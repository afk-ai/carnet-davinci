<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DaVinci · Carnet QR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#050d2b;--card:#0b1d52;--ac:#2a6bff;--tx:#fff;--mut:#9db3e8}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--tx);display:flex;justify-content:center;padding:20px}
main{width:100%;max-width:460px}
h1{font-size:22px;text-align:center;margin:8px 0 2px}
.sub{text-align:center;color:var(--mut);font-size:13px;margin-bottom:18px}
.box{background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px}
input,button{font:inherit;border-radius:10px;border:0;padding:12px;width:100%}
input{background:#fff;color:#000;margin-bottom:10px}
button{background:var(--ac);color:#fff;font-weight:bold;cursor:pointer;margin-top:6px}
button.alt{background:transparent;border:1px solid var(--ac)}
.qr{text-align:center}
.qr canvas{background:#fff;padding:10px;border-radius:12px;max-width:100%}
.name{font-size:20px;font-weight:bold;text-align:center;margin:10px 0}
.row{color:var(--mut);font-size:14px;margin:4px 0}.row b{color:#fff}
.ok{color:#4ade80;font-weight:bold;text-align:center;font-size:18px}
.bad{color:#f87171;font-weight:bold;text-align:center;font-size:18px}
.hide{display:none}
small{color:var(--mut)}
</style>
</head>
<body>
<main>
  <h1>DaVinci · Corporación Educativa</h1>
  <div class="sub" id="sub">Generador de QR para carnet</div>

  <!-- Modo verificación (se abre al escanear el QR) -->
  <div id="verify" class="box hide"></div>

  <!-- Modo generador -->
  <div id="gen">
    <div class="box">
      <input id="ced" placeholder="Cédula del estudiante (ej. 32917552)" inputmode="numeric">
      <button id="btnBuscar">Generar QR</button>
      <button id="btnTodos" class="alt">Descargar QR de todos (ZIP)</button>
      <div id="loadMsg"><small>Cargando base de datos…</small></div>
      <input type="file" id="file" accept=".xlsx" class="hide">
    </div>
    <div id="res" class="box qr hide">
      <canvas id="cv"></canvas>
      <div class="name" id="nm"></div>
      <div id="info"></div>
      <button id="btnDl">Descargar PNG</button>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const norm = v => String(v ?? "").replace(/\D/g, "");   // "32.917.552" -> "32917552"
let DB = {};

// ---------- Base de datos (Excel) ----------
function parse(buf){
  const wb = XLSX.read(buf, {type:"array"});
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:""});
  DB = {};
  rows.forEach(r => { const k = norm(r.cedula); if(k) DB[k] = r; });
  $("loadMsg").innerHTML = `<small>✔ ${Object.keys(DB).length} estudiantes cargados</small>`;
}
async function load(){
  try{
    const r = await fetch("estudiantes.xlsx?t=" + Date.now());
    if(!r.ok) throw 0;
    parse(await r.arrayBuffer());
  }catch(e){
    $("loadMsg").innerHTML = "<small>No se pudo leer estudiantes.xlsx automáticamente. Selecciónalo:</small>";
    $("file").classList.remove("hide");
  }
}
$("file").onchange = async e => { parse(await e.target.files[0].arrayBuffer()); verifyMode(); };

// ---------- QR ----------
function urlFor(c){ return location.origin + location.pathname + "?v=" + c; }
function drawQR(canvas, text, size){
  const q = qrcode(0, "M"); q.addData(text); q.make();
  const n = q.getModuleCount(), m = Math.floor(size / (n + 2)), px = m * (n + 2);
  canvas.width = canvas.height = px;
  const x = canvas.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0, 0, px, px); x.fillStyle = "#000";
  for(let i = 0; i < n; i++) for(let j = 0; j < n; j++) if(q.isDark(i, j)) x.fillRect((j+1)*m, (i+1)*m, m, m);
}
const png = c => new Promise(r => c.toBlob(r, "image/png"));
const save = (blob, name) => { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); };

// ---------- Generador ----------
let current = null;
$("btnBuscar").onclick = () => {
  const c = norm($("ced").value), s = DB[c];
  if(!s){ alert("Cédula no encontrada en la base de datos."); return; }
  current = c;
  drawQR($("cv"), urlFor(c), 300);
  $("nm").textContent = s.nombre;
  $("info").innerHTML = `<div class="row">Cédula: <b>${s.cedula}</b></div><div class="row">Curso: <b>${s.curso}</b></div>`;
  $("res").classList.remove("hide");
};
$("btnDl").onclick = async () => {
  const cv = document.createElement("canvas"); drawQR(cv, urlFor(current), 600);
  save(await png(cv), `QR_${current}.png`);
};
$("btnTodos").onclick = async () => {
  const zip = new JSZip(), cv = document.createElement("canvas");
  for(const c in DB){ drawQR(cv, urlFor(c), 600); zip.file(`QR_${c}.png`, await png(cv)); }
  save(await zip.generateAsync({type:"blob"}), "qr_carnets.zip");
};

// ---------- Verificación (al escanear) ----------
function verifyMode(){
  const v = norm(new URLSearchParams(location.search).get("v"));
  if(!v) return;
  $("gen").classList.add("hide"); $("verify").classList.remove("hide");
  $("sub").textContent = "Verificación de carnet";
  const s = DB[v];
  $("verify").innerHTML = !s
    ? `<div class="bad">✖ Carnet no válido</div>`
    : `<div class="${s.estado === "Inactivo" ? "bad" : "ok"}">${s.estado === "Inactivo" ? "✖ Estudiante inactivo" : "✔ Carnet válido"}</div>
       <div class="name">${s.nombre}</div>
       <div class="row">Cédula: <b>${s.cedula}</b></div>
       <div class="row">Teléfono: <b>${s.telefono}</b></div>
       <div class="row">Curso: <b>${s.curso}</b></div>`;
}
load().then(verifyMode);
</script>
</body>
</html>
